# Whitelist prikazu povolenych behem hry
allowed-commands-in-game:
  - "/towers leave"
  - "/msg"

# Blacklist itemu, ktere hraci nemohou dostat (Format: MATERIAL_NAME)
item-blacklist:
  - "OPERATOR_PERSPECTIVE_EGG"
  - "COMMAND_BLOCK"
  - "CHAIN_COMMAND_BLOCK"
  - "REPEAT_COMMAND_BLOCK"
  - "STRUCTURE_BLOCK"
  - "BARRIER"
  - "LIGHT"
  - "ALLAY_SPAWN_EGG"
  - "AXOLOTL_SPAWN_EGG"
  - "BAT_SPAWN_EGG"

